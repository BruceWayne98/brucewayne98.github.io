<header class="fixed top-0 inset-x-0 z-40 px-4 py-3 sm:py-4 transition-all duration-200">
    <div class="max-w-5xl mx-auto flex items-center justify-between glass-nav rounded-2xl sm:rounded-full px-4 sm:px-6 py-2.5 sm:py-3 shadow-lg shadow-zinc-950/5">
        
        <!-- Brand & Status -->
        <a href="{{ "/" | relLangURL }}" class="flex items-center gap-3 group">
            <div class="relative w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 p-[1.5px] flex-shrink-0">
                <div class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center text-white text-xs font-bold">
                    BK
                </div>
                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-white dark:border-zinc-900 status-pulse" title="Available for collaborations"></span>
            </div>
            <div class="flex flex-col">
                <span class="text-sm font-bold tracking-tight text-zinc-900 dark:text-zinc-100 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
                    Bharath Kumar
                </span>
                <span class="hidden sm:inline text-[11px] text-zinc-500 dark:text-zinc-400 font-mono -mt-0.5">
                    Senior Software Eng
                </span>
            </div>
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-1 text-sm font-medium text-zinc-600 dark:text-zinc-400">
            <a href="{{ "/" | relLangURL }}" class="px-3 py-1.5 rounded-full transition-colors {{ if .IsHome }}bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold{{ else }}hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100/80 dark:hover:bg-zinc-800/50{{ end }}">
                Home
            </a>
            <a href="{{ "/about/" | relLangURL }}" class="px-3 py-1.5 rounded-full transition-colors {{ if eq .RelPermalink "/about/" }}bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold{{ else }}hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100/80 dark:hover:bg-zinc-800/50{{ end }}">
                About
            </a>
            <a href="{{ "/experience/" | relLangURL }}" class="px-3 py-1.5 rounded-full transition-colors {{ if eq .RelPermalink "/experience/" }}bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold{{ else }}hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100/80 dark:hover:bg-zinc-800/50{{ end }}">
                Experience
            </a>
            <a href="{{ "/papers/" | relLangURL }}" class="px-3 py-1.5 rounded-full transition-colors {{ if eq .RelPermalink "/papers/" }}bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold{{ else }}hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100/80 dark:hover:bg-zinc-800/50{{ end }}">
                Papers
            </a>
            <a href="{{ "/blogs/" | relLangURL }}" class="px-3 py-1.5 rounded-full transition-colors {{ if or (eq .RelPermalink "/blogs/") (eq .Section "blogs") }}bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold{{ else }}hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100/80 dark:hover:bg-zinc-800/50{{ end }}">
                Blogs
            </a>
            <a href="{{ "/projects/" | relLangURL }}" class="px-3 py-1.5 rounded-full transition-colors {{ if or (eq .RelPermalink "/projects/") (eq .Section "projects") }}bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold{{ else }}hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100/80 dark:hover:bg-zinc-800/50{{ end }}">
                Projects
            </a>
            <a href="{{ "/graph/" | relLangURL }}" target="_blank" class="px-3 py-1.5 rounded-full transition-colors flex items-center gap-1 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/40">
                <span>Graph</span>
                <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
        </nav>

        <!-- Right: Actions & Tools -->
        <div class="flex items-center gap-2">
            <!-- Search Button (Cmd+K) -->
            <button onclick="openSearchModal()" 
                    class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 bg-zinc-100/80 dark:bg-zinc-800/70 border border-zinc-200/70 dark:border-zinc-700/60 rounded-full hover:border-zinc-300 dark:hover:border-zinc-600 transition-all"
                    title="Quick search (Cmd+K / Ctrl+K)">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35"/>
                </svg>
                <span class="hidden sm:inline">Search</span>
                <kbd class="hidden sm:inline px-1.5 py-0.5 text-[10px] font-mono bg-zinc-200/70 dark:bg-zinc-700/70 rounded text-zinc-600 dark:text-zinc-300">⌘K</kbd>
            </button>

            <!-- Theme Switcher -->
            <button onclick="toggleTheme()" 
                    class="p-2 rounded-full text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800/80 transition-colors"
                    aria-label="Toggle theme">
                <!-- Sun icon (shown in dark mode) -->
                <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <!-- Moon icon (shown in light mode) -->
                <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>

            <!-- Mobile Hamburger Menu Button -->
            <button id="mobile-menu-btn" 
                    onclick="toggleMobileMenu()"
                    class="md:hidden p-2 rounded-full text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors"
                    aria-label="Open mobile menu">
                <svg id="menu-open-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg id="menu-close-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobile-menu" class="hidden md:hidden max-w-5xl mx-auto mt-2 p-4 glass-nav rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-xl flex flex-col gap-2 animate-in fade-in slide-in-from-top-2 duration-200">
        <a href="{{ "/" | relLangURL }}" onclick="toggleMobileMenu()" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-zinc-100 dark:hover:bg-zinc-800/80 text-zinc-900 dark:text-zinc-100">
            Home
        </a>
        <a href="{{ "/about/" | relLangURL }}" onclick="toggleMobileMenu()" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-zinc-100 dark:hover:bg-zinc-800/80 text-zinc-900 dark:text-zinc-100">
            About
        </a>
        <a href="{{ "/experience/" | relLangURL }}" onclick="toggleMobileMenu()" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-zinc-100 dark:hover:bg-zinc-800/80 text-zinc-900 dark:text-zinc-100">
            Experience
        </a>
        <a href="{{ "/papers/" | relLangURL }}" onclick="toggleMobileMenu()" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-zinc-100 dark:hover:bg-zinc-800/80 text-zinc-900 dark:text-zinc-100">
            Research Papers
        </a>
        <a href="{{ "/blogs/" | relLangURL }}" onclick="toggleMobileMenu()" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-zinc-100 dark:hover:bg-zinc-800/80 text-zinc-900 dark:text-zinc-100">
            Blog Posts
        </a>
        <a href="{{ "/projects/" | relLangURL }}" onclick="toggleMobileMenu()" class="px-3 py-2 rounded-xl text-sm font-medium hover:bg-zinc-100 dark:hover:bg-zinc-800/80 text-zinc-900 dark:text-zinc-100">
            Projects
        </a>
        <a href="{{ "/graph/" | relLangURL }}" target="_blank" class="px-3 py-2 rounded-xl text-sm font-medium text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 flex items-center justify-between">
            <span>Knowledge Graph</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
        </a>
    </div>
</header>

<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const openIcon = document.getElementById('menu-open-icon');
        const closeIcon = document.getElementById('menu-close-icon');
        const isHidden = menu.classList.contains('hidden');
        if (isHidden) {
            menu.classList.remove('hidden');
            openIcon.classList.add('hidden');
            closeIcon.classList.remove('hidden');
        } else {
            menu.classList.add('hidden');
            openIcon.classList.remove('hidden');
            closeIcon.classList.add('hidden');
        }
    }
</script>
