<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.role | default "Senior Software Engineer" }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    
    <!-- Meta & SEO -->
    {{ $authorData := index site.Data .Language.Lang "author" }}
    {{ $author := cond (and $authorData $authorData.author) $authorData.author site.Params }}
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with $author.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
    <meta name="author" content="{{ $author.name }}">
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with $author.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "favicon.svg" | relURL }}">
    <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
    
    <!-- Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    
    <!-- Pre-compiled Tailwind CSS -->
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
    
    <!-- Prevent theme flash (FOUC) -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:bg-emerald-400/20 dark:selection:text-emerald-300">
    <!-- Header -->
    {{ partial "header.html" . }}
    
    <!-- Main Content Area -->
    <main id="main-content" class="flex-grow pt-24 pb-16">
        {{ block "main" . }}{{ end }}
    </main>
    
    <!-- Footer -->
    {{ partial "footer.html" . }}
    
    <!-- Search Modal (Cmd+K) -->
    {{ partial "search-modal.html" . }}
    
    <!-- Global Client Scripts -->
    <script>
        // Dark Mode Toggle
        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        window.toggleTheme = toggleTheme;

        // Copy code to clipboard for code blocks
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('pre').forEach(pre => {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative group';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.setAttribute('aria-label', 'Copy code');
                btn.innerHTML = `
                    <svg class="w-3.5 h-3.5 copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-width="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-width="2"/>
                    </svg>
                    <span class="copy-text">Copy</span>
                `;

                btn.addEventListener('click', async () => {
                    const code = pre.querySelector('code')?.innerText || pre.innerText;
                    await navigator.clipboard.writeText(code);
                    const copyText = btn.querySelector('.copy-text');
                    copyText.textContent = 'Copied!';
                    btn.classList.add('text-emerald-500', 'dark:text-emerald-400');
                    setTimeout(() => {
                        copyText.textContent = 'Copy';
                        btn.classList.remove('text-emerald-500', 'dark:text-emerald-400');
                    }, 2000);
                });

                wrapper.appendChild(btn);
            });
        });
    </script>
</body>
</html>
